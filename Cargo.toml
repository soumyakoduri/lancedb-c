# This file should be copied to /home/yuvalif/lancedb/c/Cargo.toml

[package]
name = "lancedb-c"
version = "0.22.3"
edition = "2021"
description = "C bindings for LanceDB"
license = "Apache-2.0"
repository = "https://github.com/yuvalif/lancedb-c"
keywords = ["database", "vector", "search", "c", "ffi"]
categories = ["database", "api-bindings"]
rust-version = "1.78.0"

[workspace]
members = ["examples/s3_object_store"]

[lib]
name = "lancedb"
crate-type = ["cdylib", "staticlib"]

[dependencies]
tokio = { version = "1.23", features = ["rt-multi-thread"] }
libc = "0.2"
lancedb = { path = "../lancedb/rust/lancedb", features = ["remote"] }
lance = { path = "../lance/rust/lance", default-features = false }
lance-io = { path = "../lance/rust/lance-io", default-features = false, features = ["rgw"] }
lance-file = { path = "../lance/rust/lance-file", default-features = false }
lance-namespace = { path = "../lance/rust/lance-namespace" }
arrow = { version = "57.2", optional = false, features = ["ffi"] }
arrow-array = "57.2"
arrow-data = "57.2"
arrow-schema = "57.2"
object_store = "0.12"
futures = "0"
chrono = "0"
lancedb-s3-object-store = { path = "examples/s3_object_store", optional = true }

[features]
s3-helper = ["lancedb-s3-object-store"]
rgw = ["object_store/rgw"]

[patch.crates-io]
object_store = { path = "../arrow-rs-object-store" }
